services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://gilsamedia.github.io}
    volumes:
      - chats:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - models:/root/.ollama
    # The API is intentionally not exposed to the network.
    # For NVIDIA acceleration, use the optional compose.gpu.yaml override.
volumes:
  chats:
  models:
